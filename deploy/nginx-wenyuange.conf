server {
    listen 80;
    listen [::]:80;
    server_name bishe.xin www.bishe.xin;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /www/wwwroot/wenyuange;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 8.208.113.137;

    index index.html;
    root /www/wwwroot/wenyuange;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/wenyuange.log;
    error_log  /www/wwwlogs/wenyuange.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bishe.xin www.bishe.xin;

    index index.html;
    root /www/wwwroot/wenyuange;

    ssl_certificate     /www/server/panel/vhost/cert/bishe.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/bishe.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /www/wwwroot/wenyuange;
    }

    # 点文件（.git / .env / 编辑器备份等）一律不给
    location ~ /\. { deny all; }

    # 反馈接口：只收 JSON，body 上限压到 128k（正常一条反馈远小于此）
    location ^~ /api/ {
        client_max_body_size 128k;
        include enable-php-82.conf;
    }

    # 反馈后台：同样交给 php-fpm；路径本身是随机的，另有一道密码
    location ^~ /ops-23beaa6d/ {
        # 目录里是 index.php；server 级的 index 只写了 index.html，
        # 不加这行访问 /ops-23beaa6d/ 会 403（目录索引被禁）
        index index.php;
        client_max_body_size 128k;
        include enable-php-82.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/wenyuange.log;
    error_log  /www/wwwlogs/wenyuange.error.log;
}
